name: Managed Authorization Smoke

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  production-auth-boundary:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Unauthenticated production request is rejected
        shell: bash
        run: |
          set -euo pipefail

          code="$(curl --silent --show-error \
            --output unauth.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            https://api.zfinia.com/v1/crosscheck/action/authorize)"

          cat unauth.json
          test "$code" = "401"
          grep -q '"authorized":false' unauth.json
          grep -q '"code":"github_oidc_invalid"' unauth.json

      - name: Real GitHub OIDC reaches paid authorization boundary
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.zfinia.com%2Fcrosscheck")"

          token="$(printf '%s' "$response" | node -e "
            let s='';
            process.stdin.on('data',d=>s+=d);
            process.stdin.on('end',()=>{
              const value=JSON.parse(s).value;
              if(!value) process.exit(2);
              process.stdout.write(value);
            });
          ")"

          code="$(curl --silent --show-error \
            --output oidc.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            https://api.zfinia.com/v1/crosscheck/action/authorize)"

          unset token response
          cat oidc.json
          test "$code" = "403"
          grep -q '"authorized":false' oidc.json
          grep -q '"code":"repository_not_protected"' oidc.json
